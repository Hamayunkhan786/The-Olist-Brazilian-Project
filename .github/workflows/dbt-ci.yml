name: dbt CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest

    env:
      DBT_PROFILES_DIR: /home/runner/.dbt

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dbt-snowflake
        run: |
          python -m pip install --upgrade pip
          pip install dbt-core==1.12.3 dbt-snowflake==1.12.0

      - name: Create dbt profile
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml <<EOF
          olist_transformation:
            target: dev
            outputs:
              dev:
                type: snowflake
                account: ${{ secrets.SNOWFLAKE_ACCOUNT }}
                user: ${{ secrets.SNOWFLAKE_USER }}
                password: ${{ secrets.SNOWFLAKE_PASSWORD }}
                role: ACCOUNTADMIN
                database: ${{ secrets.SNOWFLAKE_DATABASE }}
                warehouse: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
                schema: STAGING
                threads: 4
          EOF

      - name: dbt debug
        working-directory: ./dbt_ecommerce
        run: dbt debug

      - name: dbt parse
        working-directory: ./dbt_ecommerce
        run: dbt parse

      - name: dbt run marts
        working-directory: ./dbt_ecommerce
        run: dbt run --select marts

      - name: dbt test
        working-directory: ./dbt_ecommerce
        run: dbt test
