name: dbt CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 2 * * *'

jobs:
  validate:
    runs-on: ubuntu-latest

    env:
      DBT_PROFILES_DIR: /home/runner/.dbt
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
      SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
      SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
      SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
      SNOWFLAKE_SCHEMA: ${{ secrets.SNOWFLAKE_SCHEMA }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dbt-snowflake
        run: |
          python -m pip install --upgrade pip
          pip install dbt-core==1.12.3 dbt-snowflake==1.12.0

      - name: Create dbt profile
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml <<EOF
          olist_transformation:
            target: dev
            outputs:
              dev:
                type: snowflake
                account: ${SNOWFLAKE_ACCOUNT:-dummy_account}
                user: ${SNOWFLAKE_USER:-dummy_user}
                password: ${SNOWFLAKE_PASSWORD:-dummy_pass}
                role: ${SNOWFLAKE_ROLE:-ACCOUNTADMIN}
                database: ${SNOWFLAKE_DATABASE:-dummy_db}
                warehouse: ${SNOWFLAKE_WAREHOUSE:-dummy_warehouse}
                schema: ${SNOWFLAKE_SCHEMA:-STAGING}
                threads: 4
          EOF

      - name: dbt debug
        working-directory: ./dbt_ecommerce
        run: dbt debug
        continue-on-error: true

      - name: dbt parse
        working-directory: ./dbt_ecommerce
        run: dbt parse

      - name: dbt source freshness
        working-directory: ./dbt_ecommerce
        run: dbt source freshness
        continue-on-error: true

      - name: dbt run staging
        working-directory: ./dbt_ecommerce
        run: dbt run --select staging

      - name: dbt run marts
        working-directory: ./dbt_ecommerce
        run: dbt run --select marts

      - name: dbt snapshot
        working-directory: ./dbt_ecommerce
        run: dbt snapshot
        continue-on-error: true

      - name: dbt test
        working-directory: ./dbt_ecommerce
        run: dbt test

      - name: dbt docs generate
        working-directory: ./dbt_ecommerce
        run: dbt docs generate
        continue-on-error: true

      - name: Upload dbt artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dbt-target
          path: dbt_ecommerce/target/
          retention-days: 7
