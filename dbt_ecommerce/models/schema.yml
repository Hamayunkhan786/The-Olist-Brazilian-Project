version: 2

sources:
  - name: olist_raw
    database: ECOMMERCE_DW
    schema: RAW
    description: "Raw data layer from PostgreSQL and MongoDB sources"
    freshness:
      warn_after: {count: 12, period: hour}
      error_after: {count: 24, period: hour}
    
    tables:
      - name: orders
        identifier: ORDERS
        description: "Raw orders from PostgreSQL source.orders"
        config:
          loaded_at_field: order_purchase_timestamp
        columns:
          - name: order_id
            description: "Unique order identifier"
          - name: order_status
            description: "Current order status"
          
      - name: customers
        identifier: CUSTOMERS
        description: "Raw customers from PostgreSQL source.customers"
        columns:
          - name: customer_id
            description: "Unique customer identifier"
          
      - name: order_items
        identifier: ORDER_ITEMS
        description: "Line items from PostgreSQL source.order_items"
        columns:
          - name: order_id
            description: "Reference to order"
          - name: order_item_id
            description: "Line item sequence number"

      - name: order_payments
        identifier: POSTGRES_PAYMENTS
        description: "Payment records from PostgreSQL source.order_payments"
        columns:
          - name: order_id
            description: "Reference to order"
          - name: payment_sequential
            description: "Payment sequence number for the order"
          - name: payment_type
            description: "Payment method"
          - name: payment_installments
            description: "Number of installments"
          - name: payment_value
            description: "Payment amount"
          
      - name: products
        identifier: MONGO_PRODUCTS
        description: "Products from MongoDB source"
        columns:
          - name: product_id
            description: "Unique product identifier"

      - name: reviews
        identifier: MONGO_REVIEWS
        description: "Order reviews from MongoDB source"
        columns:
          - name: review_id
            description: "Review identifier from the source"
          - name: order_id
            description: "Order associated with the review"

      - name: customer_events
        identifier: MONGO_CUSTOMER_EVENTS
        description: "Synthetic customer events from MongoDB source"

models:
  - name: stg_orders
    description: "Staging table for cleaned orders data with business logic"
    columns:
      - name: order_id
        description: "Unique order identifier"
        tests:
          - unique
          - not_null
      - name: customer_id
        description: "Foreign key to customer"
        tests:
          - not_null
          - relationships:
              to: ref('stg_customers')
              field: customer_id
      - name: order_status
        description: "Order status (created, approved, shipped, delivered, cancelled)"
        tests:
          - accepted_values:
              values: ['created', 'approved', 'shipped', 'delivered', 'canceled', 'invoiced', 'processing', 'unavailable']

  - name: stg_customers
    description: "Staging table for customer profile data"
    columns:
      - name: customer_id
        description: "Unique customer identifier"
        tests:
          - unique
          - not_null
      - name: state
        description: "State code (UF)"
        tests:
          - accepted_values:
              values: ['AC', 'AL', 'AP', 'AM', 'BA', 'CE', 'DF', 'ES', 'GO', 'MA', 'MT', 'MS', 'MG', 'PA', 'PB', 'PR', 'PE', 'PI', 'RJ', 'RN', 'RS', 'RO', 'RR', 'SC', 'SP', 'SE', 'TO']

  - name: stg_order_items
    description: "Staging table for line item data with order references"
    columns:
      - name: order_id
        description: "Foreign key to order"
        tests:
          - not_null
          - relationships:
              to: ref('stg_orders')
              field: order_id
      - name: order_item_id
        description: "Line item sequence number"
        tests:
          - not_null
      - name: product_id
        description: "Foreign key to product"
        tests:
          - not_null
          - relationships:
              to: ref('stg_products')
              field: product_id

  - name: stg_products
    description: "Staging table for raw products data"
    columns:
      - name: product_id
        description: "Unique product identifier"
        tests:
          - unique
          - not_null
      - name: product_category_name
        description: "Product category"
        tests:
          - not_null

  - name: stg_customer_events
    description: "Staging model for synthetic customer events"
    columns:
      - name: event_id
        tests:
          - not_null
          - unique
      - name: customer_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_customers')
              field: customer_id
      - name: product_id
        tests:
          - not_null
      - name: event_type
        tests:
          - not_null
          - accepted_values:
              values: ['product_view', 'product_search', 'add_to_cart', 'remove_from_cart', 'checkout_started', 'purchase']
      - name: event_timestamp
        tests:
          - not_null
      - name: session_id
        tests:
          - not_null

  - name: fct_customer_events
    description: "Customer event fact at event grain"
    columns:
      - name: event_key
        tests:
          - not_null
          - unique
      - name: event_id
        tests:
          - not_null
      - name: customer_key
        tests:
          - not_null
          - relationships:
              to: ref('stg_customers')
              field: customer_unique_id
      - name: customer_id
        tests:
          - not_null
      - name: product_id
        tests:
          - not_null
      - name: event_type
        tests:
          - not_null
          - accepted_values:
              values: ['product_view', 'product_search', 'add_to_cart', 'remove_from_cart', 'checkout_started', 'purchase']
      - name: event_timestamp
        tests:
          - not_null
      - name: session_id
        tests:
          - not_null

  - name: stg_reviews
    description: "Staging model for order reviews"
    columns:
      - name: review_id
        description: "Review identifier; repeated across different orders in the source"
        tests:
          - not_null
      - name: order_id
        description: "Order associated with the review"
        tests:
          - not_null
      - name: review_score
        description: "Review score from one to five"
        tests:
          - not_null
          - accepted_values:
              values: [1, 2, 3, 4, 5]

  - name: fct_reviews
    description: "Review fact at review and order grain"
    columns:
      - name: review_key
        description: "Composite review and order key"
        tests:
          - not_null
          - unique
      - name: review_id
        description: "Review identifier; not unique across orders"
        tests:
          - not_null
      - name: order_id
        description: "Order associated with the review"
        tests:
          - not_null
      - name: customer_key
        description: "Customer unique identifier derived through the order"
        tests:
          - relationships:
              to: ref('stg_customers')
              field: customer_unique_id
      - name: order_match_status
        description: "Whether the review order ID resolves to STG_ORDERS"
        tests:
          - not_null
          - accepted_values:
              values: ['MATCHED', 'UNMATCHED']
      - name: review_score
        description: "Review score from one to five"
        tests:
          - not_null
          - accepted_values:
              values: [1, 2, 3, 4, 5]

  - name: fct_orders
    description: "Fact table combining orders and aggregated item totals for analytics"
    columns:
      - name: order_id
        description: "Unique order identifier"
        tests:
          - unique
          - not_null
      - name: customer_id
        description: "Foreign key to customer dimension"
        tests:
          - not_null
          - relationships:
              to: ref('stg_customers')
              field: customer_id
      - name: total_items
        description: "Count of items in order"
        tests:
          - not_null
      - name: total_order_amount
        description: "Sum of item prices for the order"
        tests:
          - not_null
      - name: total_freight_amount
        description: "Sum of item freight values for the order"
        tests:
          - not_null
      - name: total_payment_value
        description: "Order item amount plus freight amount"
        tests:
          - not_null
      - name: order_status
        description: "Order status"
        tests:
          - accepted_values:
              values: ['created', 'approved', 'shipped', 'delivered', 'canceled', 'invoiced', 'processing', 'unavailable']

  - name: dim_customers
    description: "Customer dimension table with profile attributes"
    columns:
      - name: customer_key
        description: "Semantic customer key at customer_unique_id grain"
        tests:
          - unique
          - not_null
      - name: customer_unique_id
        description: "Natural customer dimension key"
        tests:
          - unique
          - not_null
      - name: customer_id
        description: "Unique customer identifier"
        tests:
          - not_null
          - relationships:
              to: ref('stg_customers')
              field: customer_id
      - name: customer_state
        description: "State code (UF)"
        tests:
          - accepted_values:
              values: ['AC', 'AL', 'AP', 'AM', 'BA', 'CE', 'DF', 'ES', 'GO', 'MA', 'MT', 'MS', 'MG', 'PA', 'PB', 'PR', 'PE', 'PI', 'RJ', 'RN', 'RS', 'RO', 'RR', 'SC', 'SP', 'SE', 'TO']

  - name: dim_products
    description: "Dimension table for product attributes and categories"
    columns:
      - name: product_id
        description: "Unique product identifier"
        tests:
          - unique
          - not_null
      - name: product_category_name
        description: "Product category classification"
        tests:
          - not_null

  - name: dim_date
    description: "Calendar dimension for analytical dates"
    columns:
      - name: date_key
        description: "Integer date key in YYYYMMDD format"
        tests:
          - unique
          - not_null
      - name: full_date
        description: "Calendar date"
        tests:
          - unique
          - not_null